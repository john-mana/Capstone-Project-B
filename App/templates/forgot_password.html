<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
</head>

<body>

    <div class="page">

        <!-- Header -->
        <header class="header">
            <div class="logo-box">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="BIO GEODA Logo">
            </div>

            <div class="header-text">
                <h1>Bio Geographic Data Analysts</h1>
                <p>ABN 579 423 418 07</p>
                <h2>🔒 This is a private site, available to approved users only</h2>
            </div>
        </header>

        <div class="header-divider"></div>

        <!-- Content -->
        <main class="forgot-content">

            <div class="forgot-card">
                <h1>Forgot Password</h1>

                <p class="forgot-subtitle">
                    ⚠️ Work in progress — password reset is not yet enabled.
                </p>

                <form id="forgotForm" method="POST" action="{{ url_for('forgot_password') }}" onsubmit="return validateEmail()">

                    <label>Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" disabled oninput="checkEmail()">

                    <div id="errorMessage" class="error-message"></div>

                    <button disabled>SEND RESET LINK</button>

                    <!-- Back按钮 -->
                    <a href="{{ url_for('main.login') }}" class="back-btn forgot-back">
                        Back to Login
                    </a>

                </form>
            </div>

        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Contact Number: +61 000 000 000</p>
            <p>Email: info@biogeoda.au</p>
            <p>Bio Geographic Data Analysts © 2026</p>
        </footer>

    </div>

    <!-- JS -->
    <script>
        function checkEmail() {
            const emailInput = document.getElementById('email').value;
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.textContent = "";

            if (!validateEmailFormat(emailInput)) {
                errorMessage.textContent = "Please enter a valid email address.";
            }
        }

        function validateEmailFormat(email) {
            const re = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
            return re.test(String(email).toLowerCase());
        }

        function validateEmail() {
            const emailInput = document.getElementById('email').value;
            const errorMessage = document.getElementById('errorMessage');

            if (!validateEmailFormat(emailInput) || errorMessage.textContent !== "") {
                errorMessage.textContent = "Please fix the issues before submitting.";
                return false;
            }

            alert("Reset link sent successfully!");
            return true;
        }
    </script>

</body>
</html>
