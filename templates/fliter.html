<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dataset Splitter</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f0f0f0; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #2c3e50; }
    .container { display: flex; gap: 20px; }
    .panel { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); flex: 1; }
    .listbox { height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 5px; margin-top: 15px; }
    .listbox label { display: block; margin: 5px 0; }
    .btn { display: inline-block; padding: 10px 15px; margin: 5px 0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-blue { background: #3498db; color: white; }
    .btn-red { background: #e74c3c; color: white; }
    .btn-green { background: #27ae60; color: white; }
    .btn-grey { background: #95a5a6; color: white; }
    .btn-orange { background: #f39c12; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    .status { margin-top: 10px; font-size: 14px; color: #7f8c8d; }
  </style>
</head>
<body>
  <button class="btn btn-grey" onclick="window.location.href='/report'">← Back to Dashboard</button>
  <h1>📊 Dataset Splitter</h1>
  <p style="text-align:center;color:#7f8c8d;"select a coulumn from a selected csv to insert the final compiled csv variable</p>

  <div class="container">
    <!-- 左侧：源数据集（选择列） -->
    <div class="panel">
      <h3>① choose csv </h3>
      <div style="text-align:center; margin:15px 0;">
        <input type="file" id="sourceFileInput" accept=".csv" style="display:none">
        <button id="loadSourceBtn" class="btn btn-blue">📂 Load Source CSV</button>
        <div id="sourceMeta" class="status"></div>
      </div>
      <div class="listbox" id="datasetList"></div>
    
    </div>

    <!-- 右侧：目标 CSV（插入位置） -->
    <div class="panel">
      <h3>② </h3>
      <div style="text-align:center; margin:15px 0;">
        <input type="file" id="targetFileInput" accept=".csv" style="display:none">
        <button id="loadTargetBtn" class="btn btn-blue">📂 Load Target CSV</button>
        <div id="targetMeta" class="status"></div>
      </div>

      <button class="btn btn-green" id="insertBtn">🔀 Downloading</button>
    </div>
  </div>

  <div class="status" id="status">Ready - load the csv in left side first</div>

  <script>
  let sourceFile = null;
  let targetFile = null;

  // ------- 绑定按钮 -------
  document.getElementById("loadSourceBtn").addEventListener("click", () => {
    document.getElementById("sourceFileInput").click();
  });
  document.getElementById("loadTargetBtn").addEventListener("click", () => {
    document.getElementById("targetFileInput").click();
  });

  // ------- 左侧：选择并上传源 CSV，渲染列名 -------
  document.getElementById("sourceFileInput").addEventListener("change", function () {
    const fileInput = this;
    if (fileInput.files.length === 0) return;

    sourceFile = fileInput.files[0];
    document.getElementById("sourceMeta").innerText = `已选择：${sourceFile.name}`;

    const formData = new FormData();
    formData.append("file", sourceFile);

    fetch("/load_dataset", { method: 'POST', body: formData })
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(data => {
        const listDiv = document.getElementById("datasetList");
        listDiv.innerHTML = "";
        if (data.status === "ok") {
          setStatus(`源 CSV 加载成功，共 ${data.columns.length} 列。`);
          data.columns.forEach(col => {
            const label = document.createElement("label");
            label.innerHTML = `<input type="checkbox" value="${col}"> ${col}`;
            listDiv.appendChild(label);
          });
        } else {
          alert("服务端错误: " + data.message);
        }
      })
      .catch(err => {
        alert("加载源 CSV 失败: " + err.message);
      });
  });

  // ------- 右侧：选择目标 CSV（本地保存） -------
  document.getElementById("targetFileInput").addEventListener("change", function () {
    const fileInput = this;
    if (fileInput.files.length === 0) return;
    targetFile = fileInput.files[0];
    document.getElementById("targetMeta").innerText = `已选择：${targetFile.name}`;
    setStatus("目标 CSV 就绪。");
  });

  // ------- 插入列并下载 -------
  document.getElementById("insertBtn").addEventListener("click", function () {
    const checked = Array.from(document.querySelectorAll("#datasetList input:checked")).map(cb => cb.value);
    if (!sourceFile) { alert("请先加载左侧源 CSV"); return; }
    if (!targetFile) { alert("请再加载右侧目标 CSV"); return; }
    if (checked.length !== 1) { alert("请只勾选 1 列作为插入列"); return; }

    const formData = new FormData();
    formData.append("source_file", sourceFile);
    formData.append("target_file", targetFile);
    formData.append("column", checked[0]);

    setStatus("正在合并并生成结果文件...");
    fetch("/insert_column", { method: "POST", body: formData })
      .then(async res => {
        if (!res.ok) {
          const msg = await res.text();
          throw new Error(msg || `HTTP ${res.status}`);
        }
        const blob = await res.blob();
        const cd = res.headers.get("Content-Disposition") || "";
        let filename = "merged.csv";
        const match = cd.match(/filename\*=UTF-8''(.+)$|filename="?([^"]+)"?/);
        if (match) filename = decodeURIComponent(match[1] || match[2]);

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        setStatus(`已生成并下载：${filename}`);
      })
      .catch(err => {
        alert("插入失败：" + err.message);
        setStatus("插入失败，请重试或检查 CSV。");
      });
  });

  function setStatus(msg) {
    document.getElementById("status").innerText = msg;
  }
</script>
</body>
</html>
