version: "3.9"

services:
  app:
    build: .
    container_name: biogeoda_flask_app
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: ./run.sh
    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: mariadb_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flora_project
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

volumes:
  db_data: